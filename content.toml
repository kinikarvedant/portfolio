# ---------------------------------------------------------------- projects
# show = false hides a project everywhere. order = position on the site.
# path = local repo; facts are read from its results files by build.py.

[[projects]]
slug = "melbourne-footfall"
short = "Melbourne Footfall"
glow = "#4cc3ff"
icon = "pin"
cards = ["results/forecast_week.png", "results/metro_tunnel_am_peak.png"]
show = true
order = 1
repo = "melbourne-footfall"
path = 'C:\Data\Projects\melbourne-footfall'
demo = "copy"            # the repo ships its own interactive demo in demo/
title = "Melbourne foot traffic: the Metro Tunnel and week-ahead forecasts"
kicker = "Solo · Oct 2026 · live demo"
summary = "1.6 million hourly counts from the City of Melbourne's pedestrian sensors, used to test whether the Metro Tunnel changed street-level foot traffic, and to forecast 99 of its sensors a week ahead."
highlights = [
  "Forecast error of {wape_model}% vs {wape_naive}% for a same-hour-last-week baseline ({wape_4w}% for a 4-week average), across {test_sensors} sensors and 8 test weeks.",
  "No measurable Metro Tunnel effect at the 150 m radius fixed in advance. A triple-counted street corner that faked an 11% effect was caught and fixed before publishing.",
  "Cleans a feed that silently drops zero-count hours: night gaps are read as zeros, daytime gaps as sensor outages.",
]
stack = ["Python", "pandas", "scikit-learn", "Leaflet", "Chart.js"]
description = "Melbourne pedestrian sensors: did the Metro Tunnel change foot traffic, and a week-ahead forecast per sensor"
topics = ["data-science", "forecasting", "melbourne", "open-data", "pandas", "scikit-learn"]

[[projects]]
slug = "smart-traffic-drl"
short = "Smart Traffic RL"
glow = "#5ee08a"
icon = "signal"
cards = ["results/figures/ppo_demo.gif", "results/figures/ppo_vs_fixed_time.png"]
show = true
order = 2
repo = "smart-traffic-drl"
path = 'C:\Data\Projects\smart-traffic-drl'
demo = "page"            # the repo's demo/ folder (a replay of recorded runs) is published at projects/smart-traffic-drl/demo/
