title = "Traffic signals with deep reinforcement learning"
kicker = "Solo · 2025, re-evaluated Oct 2026 · live replay"
summary = "A PPO agent decides which direction gets green at a simulated four-way intersection in SUMO, and is compared fairly with fixed-time signal plans over five seeds."
highlights = [
  "Mean wait of {ppo_regular}s per vehicle vs {fixed10_regular}s for the best of three fixed-time plans tested, on the traffic pattern it trained on.",
  "On random arrivals it never saw, it loses ({ppo_random}s vs {fixed10_random}s), and the write-up says so.",
  "Fixed an action-space bug that had the agent choosing between green and yellow instead of between directions.",
]
stack = ["Python", "PyTorch", "Stable-Baselines3", "SUMO", "Gymnasium"]
images = ["results/figures/ppo_demo.gif", "results/figures/ppo_vs_fixed_time.png", "results/figures/training_curve.png"]
image_alts = ["Animation of the PPO agent switching the lights at the simulated intersection", "Bar charts of waiting time, queue length and throughput for PPO and three fixed-time plans", "Training curves: reward and mean waiting time per episode"]
description = "Deep reinforcement learning (PPO) for traffic signal control in SUMO, evaluated against fixed-time plans"
